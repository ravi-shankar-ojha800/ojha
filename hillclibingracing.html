<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector 9 - Industrial Zone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- HUD STYLING MATCHING IMAGE --- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Objective Box Top-Left */
        .objective-box {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(15, 18, 22, 0.85);
            border-left: 4px solid #FF5500;
            padding: 8px 16px;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Health & Armor Bars Bottom-Left */
        .status-container {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bar-wrapper {
            height: 18px;
            background: rgba(10, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }

        .hp-fill { background: #1EA0EA; width: 100%; }
        .shield-fill { background: #25C974; width: 100%; }

        .bar-text {
            position: absolute;
            top: 0;
            left: 8px;
            height: 100%;
            display: flex;
            align-items: center;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 800;
            text-shadow: 1px 1px 2px #000;
        }

        /* Ammo Display Bottom-Right */
        .ammo-container {
            position: absolute;
            bottom: 24px;
            right: 32px;
            color: #FFFFFF;
            text-align: right;
            font-family: Impact, sans-serif;
        }

        .ammo-main {
            font-size: 52px;
            line-height: 1;
            font-weight: bold;
        }

        .ammo-sub {
            font-size: 24px;
            color: #888888;
        }

        /* Minimap Top-Right */
        .minimap-wrapper {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 170px;
            height: 170px;
            background: rgba(15, 20, 25, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            border-radius: 2px;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        .minimap-label {
            position: absolute;
            bottom: -22px;
            right: 24px;
            color: #AAAAAA;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Red Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 50, 50, 0.8);
            border: 1px solid #000;
        }

        /* Overlay Instructions Screen */
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            cursor: pointer;
            z-index: 10;
        }

        #instructions h1 {
            font-size: 42px;
            letter-spacing: 3px;
            color: #FF5500;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #instructions p {
            font-size: 16px;
            color: #CCCCCC;
            margin-bottom: 24px;
        }

        .btn-start {
            background: #FF5500;
            color: #FFF;
            padding: 12px 36px;
            font-weight: 800;
            font-size: 16px;
            border: none;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="objective-box">
            <span>ELIMINATE ENEMIES (<span id="obj-count">0</span>/20)</span>
        </div>

        <div class="status-container">
            <div class="bar-wrapper">
                <div class="bar-fill hp-fill" id="hp-bar"></div>
                <div class="bar-text" id="hp-text">100/100</div>
            </div>
            <div class="bar-wrapper">
                <div class="bar-fill shield-fill" id="shield-bar"></div>
                <div class="bar-text" id="shield-text">50/50</div>
            </div>
        </div>

        <div id="crosshair"></div>

        <div class="minimap-wrapper">
            <canvas id="minimap-canvas" width="170" height="170"></canvas>
        </div>
        <div class="minimap-label">Veridian Industrial Zone</div>

        <div class="ammo-container">
            <span class="ammo-main" id="ammo-clip">30</span>
            <span class="ammo-sub">/<span id="ammo-reserve">90</span></span>
        </div>
    </div>

    <div id="instructions">
        <h1>VERIDIAN WARZONE</h1>
        <p>HIGH-INTENSITY COMBAT SIMULATION</p>
        <button class="btn-start">DEPLOY INTO ZONE</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- GAME STATE & VARS ---
        let health = 100, shield = 50, ammoClip = 30, ammoReserve = 90, kills = 0;
        let isReloading = false;

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let canJump = false, yaw = 0, pitch = 0;
        const keys = { W: false, A: false, S: false, D: false, Shift: false };

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x22272e); // Moody dark sky color
        scene.fog = new THREE.FogExp2(0x22272e, 0.012);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // --- LIGHTING (Moody Battlefield Tone) ---
        const ambientLight = new THREE.AmbientLight(0x556677, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(50, 80, -40);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 250;
        const d = 60;
        sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // --- ENVIRONMENT GENERATION ---
        const collidableObjects = [];

        // Wet Mud Terrain with Reflection
        const floorGeo = new THREE.PlaneGeometry(300, 300, 64, 64);
        
        // Displace vertices for rough ground
        const posAttr = floorGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const vx = posAttr.getX(i);
            const vy = posAttr.getY(i);
            const nz = (Math.sin(vx * 0.1) + Math.cos(vy * 0.1)) * 0.4 + (Math.random() * 0.1);
            posAttr.setZ(i, nz);
        }
        floorGeo.computeVertexNormals();

        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x1c1e20,
            roughness: 0.35,  // Wet muddy sheen
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Helper texture creator for concrete walls
        function createConcreteMaterial() {
            return new THREE.MeshStandardMaterial({ color: 0x4a4d52, roughness: 0.85, metalness: 0.1 });
        }
        function createMetalMaterial() {
            return new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.4, metalness: 0.8 });
        }

        const concreteMat = createConcreteMaterial();
        const metalMat = createMetalMaterial();

        // Destroyed Multi-story Concrete Building
        function createRuinedBuilding(x, z) {
            const group = new THREE.Group();
            
            // Outer Pillars
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 3; j++) {
                    if (Math.random() > 0.3) {
                        const h = 8 + Math.random() * 12;
                        const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.5, h, 1.5), concreteMat);
                        pillar.position.set(i * 6 - 9, h / 2, j * 6 - 6);
                        pillar.castShadow = true;
                        group.add(pillar);
                        collidableObjects.push(pillar);
                    }
                }
            }

            // Broken Floor Slabs
            for (let f = 1; f <= 3; f++) {
                const slab = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 12), concreteMat);
                slab.position.set(0, f * 5, 0);
                slab.rotation.z = (Math.random() - 0.5) * 0.15;
                slab.castShadow = true;
                group.add(slab);
            }

            group.position.set(x, 0, z);
            scene.add(group);
        }

        createRuinedBuilding(-25, -30);
        createRuinedBuilding(30, -40);

        // Industrial Warehouse Skeleton
        function createWarehouse(x, z) {
            const group = new THREE.Group();
            for (let i = -15; i <= 15; i += 6) {
                // Steel beams
                const beamL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 10, 0.4), metalMat);
                beamL.position.set(-10, 5, i);
                const beamR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 10, 0.4), metalMat);
                beamR.position.set(10, 5, i);
                
                const roofBeam = new THREE.Mesh(new THREE.BoxGeometry(20.5, 0.4, 0.4), metalMat);
                roofBeam.position.set(0, 10, i);

                group.add(beamL, beamR, roofBeam);
                collidableObjects.push(beamL, beamR);
            }
            group.position.set(x, 0, z);
            scene.add(group);
        }

        createWarehouse(20, 10);

        // Destroyed APC / Tank Asset
        function createTank(x, z, rot) {
            const group = new THREE.Group();
            const hull = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.8, 7), metalMat);
            hull.position.y = 1.2;
            hull.castShadow = true;

            const turret = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.2, 3.2), metalMat);
            turret.position.set(0, 2.4, -0.5);
            turret.castShadow = true;

            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 4), metalMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 2.5, 2.2);

            group.add(hull, turret, barrel);
            group.position.set(x, 0, z);
            group.rotation.y = rot;
            scene.add(group);
            collidableObjects.push(hull);
        }

        createTank(0, -20, 0.4);
        createTank(-15, 10, -0.8);

        // Sandbag Barricades & Debris
        function createSandbags(x, z, rot) {
            const group = new THREE.Group();
            const sbMat = new THREE.MeshStandardMaterial({ color: 0x8a7a59, roughness: 0.9 });
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 2; j++) {
                    const bag = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 0.6), sbMat);
                    bag.position.set(i * 1.1 - 1, j * 0.4 + 0.2, 0);
                    bag.castShadow = true;
                    group.add(bag);
                }
            }
            group.position.set(x, 0, z);
            group.rotation.y = rot;
            scene.add(group);
            collidableObjects.push(group);
        }

        createSandbags(-5, -10, 0.2);
        createSandbags(8, -12, -0.5);
        createSandbags(-18, -18, 1.1);

        // Distant Smoke Pillars
        const smokeParticles = [];
        function createSmokePillar(x, z) {
            const pGeo = new THREE.DodecahedronGeometry(2, 1);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.4 });
            for (let i = 0; i < 15; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(x + (Math.random() - 0.5) * 4, i * 2.5 + 2, z + (Math.random() - 0.5) * 4);
                const s = 1 + Math.random() * 2;
                p.scale.set(s, s, s);
                scene.add(p);
                smokeParticles.push({ mesh: p, startY: p.position.y });
            }
        }

        createSmokePillar(5, -60);
        createSmokePillar(-45, -70);

        // --- WAR DRONES IN THE SKY ---
        const drones = [];
        function createDrone(x, y, z) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.4, 2), metalMat);
            
            // Red Eye Light
            const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(0, -0.1, 1);
            group.add(body, eye);

            // Rotor mounts
            for (let i of [-1.2, 1.2]) {
                for (let j of [-1.2, 1.2]) {
                    const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), metalMat);
                    mount.position.set(i, 0, j);
                    group.add(mount);
                }
            }

            group.position.set(x, y, z);
            scene.add(group);
            drones.push({ mesh: group, basePos: new THREE.Vector3(x, y, z), timeOffset: Math.random() * 10 });
        }

        createDrone(0, 22, -30);
        createDrone(-30, 28, -10);
        createDrone(25, 25, -45);

        // --- HIGH-DETAIL WEAPON (Assault Rifle with Holographic Scope) ---
        const weaponGroup = new THREE.Group();
        
        // Receiver & Handguard
        const rBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 0.6), metalMat);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5), metalMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.02, -0.5);

        // Suppressor / Muzzle
        const suppressor = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.3), metalMat);
        suppressor.rotation.x = Math.PI / 2;
        suppressor.position.set(0, 0.02, -0.8);

        // Holographic Sight Mount & Glass
        const sightFrame = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.15), metalMat);
        sightFrame.position.set(0, 0.13, -0.1);

        const glassMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
        const sightGlass = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.01), glassMat);
        sightGlass.position.set(0, 0.14, -0.1);

        // Red Reticle Point on Sight
        const reticle = new THREE.Mesh(new THREE.PlaneGeometry(0.02, 0.02), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        reticle.position.set(0, 0.14, -0.095);

        // Magazine
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.12), metalMat);
        mag.position.set(0, -0.15, -0.05);
        mag.rotation.x = 0.2;

        weaponGroup.add(rBody, barrel, suppressor, sightFrame, sightGlass, reticle, mag);
        weaponGroup.position.set(0.24, -0.22, -0.45);
        camera.add(weaponGroup);
        scene.add(camera);

        camera.position.set(0, 1.7, 5);

        // --- ENEMY AI SYSTEM ---
        const enemies = [];
        function spawnEnemy(x, z) {
            const group = new THREE.Group();
            
            // Tactical Body (Dark Armor)
            const armorMat = new THREE.MeshStandardMaterial({ color: 0x1f2421, roughness: 0.5 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.7, 0.5), armorMat);
            body.position.y = 0.85;
            body.castShadow = true;

            // Helmet with Glowing Visor
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), armorMat);
            head.position.y = 1.95;

            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.1), new THREE.MeshBasicMaterial({ color: 0xff3300 }));
            visor.position.set(0, 1.95, 0.23);

            group.add(body, head, visor);
            group.position.set(x, 0, z);
            scene.add(group);

            enemies.push({
                mesh: group,
                hp: 100,
                lastShoot: 0,
                speed: 3.5 + Math.random() * 2
            });
            collidableObjects.push(body);
        }

        // Spawn Initial Enemy Squad
        spawnEnemy(0, -25);
        spawnEnemy(-12, -35);
        spawnEnemy(18, -20);
        spawnEnemy(-22, -15);

        // --- CONTROLS & EVENT LISTENERS ---
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                instructions.style.display = 'none';
            } else {
                instructions.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            camera.rotation.x = pitch;
            camera.rotation.y = yaw;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.W = true;
            if (e.code === 'KeyS') keys.S = true;
            if (e.code === 'KeyA') keys.A = true;
            if (e.code === 'KeyD') keys.D = true;
            if (e.code === 'ShiftLeft') keys.Shift = true;
            if (e.code === 'Space' && canJump) { velocity.y = 8.5; canJump = false; }
            if (e.code === 'KeyR') reload();
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.W = false;
            if (e.code === 'KeyS') keys.S = false;
            if (e.code === 'KeyA') keys.A = false;
            if (e.code === 'KeyD') keys.D = false;
            if (e.code === 'ShiftLeft') keys.Shift = false;
        });

        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement === document.body && e.button === 0) {
                shootWeapon();
            }
        });

        // --- FIRING & RECOIL ---
        const raycaster = new THREE.Raycaster();
        let recoilVal = 0, swayTimer = 0;

        function shootWeapon() {
            if (ammoClip <= 0 || isReloading) return;

            ammoClip--;
            document.getElementById('ammo-clip').textContent = ammoClip;

            // Recoil
            recoilVal = 0.08;
            pitch += 0.008;

            // Flash effect
            const flash = new THREE.PointLight(0xffaa00, 3, 5);
            flash.position.set(0.24, -0.1, -1.0);
            camera.add(flash);
            setTimeout(() => camera.remove(flash), 40);

            // Raycast Hit Check
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Check enemies hit
            enemies.forEach((enemy, index) => {
                const hits = raycaster.intersectObjects(enemy.mesh.children);
                if (hits.length > 0) {
                    enemy.hp -= 35;
                    
                    // Blood / Spark Effect
                    createHitEffect(hits[0].point);

                    if (enemy.hp <= 0) {
                        scene.remove(enemy.mesh);
                        enemies.splice(index, 1);
                        kills++;
                        document.getElementById('obj-count').textContent = kills;
                        // Respawn new aggressive enemy
                        spawnEnemy((Math.random() - 0.5) * 60, -30 - Math.random() * 30);
                    }
                }
            });
        }

        function createHitEffect(pos) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff2200 }));
            p.position.copy(pos);
            scene.add(p);
            setTimeout(() => scene.remove(p), 300);
        }

        function reload() {
            if (isReloading || ammoReserve <= 0 || ammoClip === 30) return;
            isReloading = true;
            document.getElementById('ammo-clip').textContent = "--";

            setTimeout(() => {
                const needed = 30 - ammoClip;
                const available = Math.min(needed, ammoReserve);
                ammoClip += available;
                ammoReserve -= available;
                document.getElementById('ammo-clip').textContent = ammoClip;
                document.getElementById('ammo-reserve').textContent = ammoReserve;
                isReloading = false;
            }, 1200);
        }

        function takeDamage(amount) {
            if (shield > 0) {
                shield = Math.max(0, shield - amount);
            } else {
                health = Math.max(0, health - amount);
            }

            document.getElementById('hp-bar').style.width = health + '%';
            document.getElementById('shield-bar').style.width = (shield / 50 * 100) + '%';
            document.getElementById('hp-text').textContent = `${Math.ceil(health)}/100`;
            document.getElementById('shield-text').textContent = `${Math.ceil(shield)}/50`;

            if (health <= 0) {
                alert("KILLED IN ACTION! REDEPLOYING...");
                health = 100;
                shield = 50;
                camera.position.set(0, 1.7, 5);
            }
        }

        // --- MINIMAP DRAWING ---
        const mapCanvas = document.getElementById('minimap-canvas');
        const mapCtx = mapCanvas.getContext('2d');

        function updateMinimap() {
            mapCtx.fillStyle = '#0f1419';
            mapCtx.fillRect(0, 0, 170, 170);

            const centerX = 85;
            const centerY = 85;

            // Player Marker
            mapCtx.fillStyle = '#00e5ff';
            mapCtx.beginPath();
            mapCtx.arc(centerX, centerY, 4, 0, Math.PI * 2);
            mapCtx.fill();

            // Render Enemies on Radar
            mapCtx.fillStyle = '#ff3300';
            enemies.forEach(e => {
                const relX = (e.mesh.position.x - camera.position.x) * 1.8;
                const relZ = (e.mesh.position.z - camera.position.z) * 1.8;
                
                if (Math.abs(relX) < 75 && Math.abs(relZ) < 75) {
                    mapCtx.beginPath();
                    mapCtx.arc(centerX + relX, centerY + relZ, 3, 0, Math.PI * 2);
                    mapCtx.fill();
                }
            });
        }

        // --- MAIN GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            if (document.pointerLockElement === document.body) {
                // Movement & Sprint Physics
                const speedMult = keys.Shift ? 12.0 : 7.0;
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta; // Gravity

                direction.z = Number(keys.W) - Number(keys.S);
                direction.x = Number(keys.D) - Number(keys.A);
                direction.normalize();

                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                if (keys.W || keys.S) {
                    velocity.z += direction.z * forward.z * speedMult * 10.0 * delta;
                    velocity.x += direction.z * forward.x * speedMult * 10.0 * delta;
                }
                if (keys.A || keys.D) {
                    velocity.z += direction.x * side.z * speedMult * 10.0 * delta;
                    velocity.x += direction.x * side.x * speedMult * 10.0 * delta;
                }

                camera.position.x += velocity.x * delta;
                camera.position.z += velocity.z * delta;
                camera.position.y += velocity.y * delta;

                if (camera.position.y < 1.7) {
                    velocity.y = 0;
                    camera.position.y = 1.7;
                    canJump = true;
                }

                // Procedural Gun Bobbing & Recoil Elasticity
                const isMoving = keys.W || keys.S || keys.A || keys.D;
                if (isMoving) swayTimer += delta * (keys.Shift ? 14 : 9);
                else swayTimer += delta * 2;

                recoilVal = THREE.MathUtils.lerp(recoilVal, 0, delta * 15);

                weaponGroup.position.x = 0.24 + Math.sin(swayTimer) * (isMoving ? 0.012 : 0.002);
                weaponGroup.position.y = -0.22 + Math.cos(swayTimer * 2) * (isMoving ? 0.012 : 0.002);
                weaponGroup.position.z = -0.45 + recoilVal;

                // Enemy AI Behavior (Combat Tracking & Attacks)
                enemies.forEach(enemy => {
                    const dist = enemy.mesh.position.distanceTo(camera.position);
                    
                    // Face Player
                    enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);

                    // Advance towards player if far, shoot if in range
                    if (dist > 8) {
                        const dir = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position).normalize();
                        enemy.mesh.position.x += dir.x * enemy.speed * delta;
                        enemy.mesh.position.z += dir.z * enemy.speed * delta;
                    } else {
                        // AI Shoot logic
                        if (time - enemy.lastShoot > 1.2) {
                            takeDamage(12);
                            enemy.lastShoot = time;
                        }
                    }
                });

                // Drone Animation Patrols
                drones.forEach(d => {
                    d.mesh.position.x = d.basePos.x + Math.sin(time + d.timeOffset) * 12;
                    d.mesh.position.z = d.basePos.z + Math.cos(time + d.timeOffset) * 12;
                    d.mesh.position.y = d.basePos.y + Math.sin(time * 2) * 1.5;
                });

                // Smoke rising
                smokeParticles.forEach(p => {
                    p.mesh.position.y += delta * 1.5;
                    if (p.mesh.position.y > p.startY + 25) p.mesh.position.y = p.startY;
                });

                updateMinimap();
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
